name: lab-ci
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Dump the event this run was triggered by
        env:
          EVENT_JSON: ${{ toJSON(github.event) }}
        run: |
          echo "event_name=${{ github.event_name }} sha=${GITHUB_SHA} ref=${GITHUB_REF}"
          echo "::group::github.event"
          echo "$EVENT_JSON"
          echo "::endgroup::"
